<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Ripley{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/utility.css">
    {% block head %}{% endblock %}
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">
        <img src="/static/img/ripley.png" alt="Logo" class="logo">
        <span class="brand-name">Ripley</span>
    </a>
    <button class="menu-toggle" onclick="this.setAttribute('aria-expanded', document.querySelector('.nav').classList.toggle('open'))" aria-label="Menu" aria-expanded="false" aria-controls="navigation">
        <span></span><span></span><span></span>
    </button>
    <nav class="nav" id="navigation" aria-label="Main navigation">
        <a href="/" class="{{ 'active' if request.endpoint in ('home', 'search') }}"><span class="nav-symbol" aria-hidden="true">⌕</span>Search</a>
        <a href="/active-downloads" class="{{ 'active' if request.endpoint == 'active_downloads' }}"><span class="nav-symbol" aria-hidden="true">↓</span>Downloads</a>
        <a href="/download-history" class="{{ 'active' if request.endpoint == 'download_history' }}"><span class="nav-symbol" aria-hidden="true">↶</span>History</a>
        <a href="/advanced-settings" class="{{ 'active' if request.endpoint == 'advanced_settings' }}"><span class="nav-symbol" aria-hidden="true">≡</span>Settings</a>
        <a class="nav-external" href="http://{{ qbit_host }}:9000" target="_blank" rel="noopener noreferrer">qBittorrent <span aria-hidden="true">↗</span></a>
    </nav>
</header>

<main class="wrap">
    {% block content %}{% endblock %}
</main>

<footer class="foot"></footer>

{% block scripts %}{% endblock %}
</body>
</html>
